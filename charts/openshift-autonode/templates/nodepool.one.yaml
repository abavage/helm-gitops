apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: one
spec:
  disruption:
    budgets:
    - nodes: 10%
    consolidateAfter: 0s
    consolidationPolicy: WhenEmptyOrUnderutilized
    #consolidationPolicy: WhenEmpty
    #consolidateAfter: 10m
  template:
    metadata:
      labels:
        autonode: "true"
    spec:
      requirements:
      - key: "karpenter.k8s.aws/instance-category"
        operator: In
        values: ["m", "t"]
          # minValues here enforces the scheduler to consider at least that number of unique instance-category to schedule the pods.
          # This field is ALPHA and can be dropped or replaced at any time
        #minValues: 2
      - key: "karpenter.k8s.aws/instance-family"
        operator: In
        values: ["m5","t3"]
        #minValues: 5
      - key: "karpenter.k8s.aws/instance-cpu"
        operator: In
        values: ["4", "8"]
      #- key: node.kubernetes.io/instance-type
      #  operator: In
      #  values:
      #  - c5.xlarge
      - key: "topology.kubernetes.io/zone"
        operator: In
        #values: ["ap-southeast-2a", "ap-southeast-2b", "ap-southeast-2c"]
        values: [{{ .Values.availabilityZone.aza | quote }}, {{ .Values.availabilityZone.azb | quote }}, {{ .Values.availabilityZone.azc | quote }}]
      - key: karpenter.sh/capacity-type
        operator: In
        values: ["on-demand"]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
